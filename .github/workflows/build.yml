name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: version
        name: Detect a new release version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$APP_VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # Also allow a repaired build of an unreleased version to finish publishing.
            if [[ -z "$(git ls-remote --tags origin "refs/tags/v$APP_VERSION")" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: build:mac
            artifact: macOS-arm64
          - os: windows-latest
            command: build:win
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - name: Verify installed Windows upgrade and restart
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: npm run test:update
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-update-evidence
          path: test-output/update/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: cmd-send-${{ matrix.artifact }}
          path: |
            artifacts/*.zip
            artifacts/*-Setup.exe
            artifacts/*.blockmap
            artifacts/latest.yml
          if-no-files-found: error
  mobaxterm:
    name: Real MobaXterm compatibility
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-mobaxterm.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobaxterm-evidence
          path: test-output/mobaxterm/
          if-no-files-found: ignore
  release:
    if: needs.version.outputs.publish == 'true'
    needs: [build, version, mobaxterm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cmd-send-*
          path: release
          merge-multiple: true
      - name: Prepare source and checksums
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "v$APP_VERSION"
          test -f "release/cmd-send-$APP_VERSION-macOS-arm64.zip"
          test -f "release/cmd-send-$APP_VERSION-Windows-x64-Setup.exe"
          test -f "release/cmd-send-$APP_VERSION-Windows-x64-Setup.exe.blockmap"
          test -f release/latest.yml
          # Verify the published updater manifest points at this exact installer.
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          version = os.environ['VERSION'][1:]
          name = f'cmd-send-{version}-Windows-x64-Setup.exe'
          manifest = Path('release/latest.yml').read_text()
          digest = base64.b64encode(hashlib.sha512(Path('release', name).read_bytes()).digest()).decode()
          assert f'version: {version}' in manifest and f'url: {name}' in manifest
          assert f'sha512: {digest}' in manifest
          PY
          test -f "docs/releases/$VERSION.md"
          git archive --format=zip --prefix=cmd_send/ HEAD -o "release/cmd-send-$APP_VERSION-source.zip"
          cd release
          sha256sum *.zip *.exe *.blockmap latest.yml > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
          fi
          gh release create "$VERSION" --verify-tag --draft --title "Cmd Send $VERSION · 命令定向" --notes-file "docs/releases/$VERSION.md"
          gh release upload "$VERSION" release/*.zip release/*.exe release/*.blockmap release/latest.yml release/SHA256SUMS.txt
          gh release edit "$VERSION" --draft=false --latest

