name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: build:mac
            artifact: macOS-arm64
          - os: windows-latest
            command: build:win
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: cmd-send-${{ matrix.artifact }}
          path: artifacts/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cmd-send-*
          path: release
          merge-multiple: true
      - name: Prepare source and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "v$APP_VERSION"
          test -f "release/cmd-send-$APP_VERSION-macOS-arm64.zip"
          test -f "release/cmd-send-$APP_VERSION-Windows-x64.zip"
          test -f "docs/releases/$VERSION.md"
          git archive --format=zip --prefix=cmd_send/ HEAD -o "release/cmd-send-$APP_VERSION-source.zip"
          cd release
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --verify-tag --draft --title "Cmd Send $VERSION · 命令定向" --notes-file "docs/releases/$VERSION.md"
          gh release upload "$VERSION" release/*.zip release/SHA256SUMS.txt
          gh release edit "$VERSION" --draft=false --latest
